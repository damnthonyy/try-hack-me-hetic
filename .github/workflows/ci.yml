name: ci

on:
  push:
  pull_request:

jobs:
  build_and_smoke_test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP syntax check
        run: php -v && find public src -name "*.php" -print0 | xargs -0 -n 1 php -l

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Smoke test HTTP
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/

      - name: Smoke test DB ping
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/db/ping >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:8080/db/ping

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Shutdown
        if: always()
        run: docker compose down -v

